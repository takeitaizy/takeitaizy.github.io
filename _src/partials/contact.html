<section id="contact">
  <div class="wrap">
    <div class="contact-card glass" style="background: var(--mist)">
      <p class="eyebrow reveal" data-en="Talk to us">דברו איתנו</p>
      <h2 class="reveal" style="max-inline-size: 20ch" data-en="{{contact_h_en}}">{{contact_h}}</h2>
      <p class="lead reveal" data-en="{{contact_lead_en}}">{{contact_lead}}</p>
      <ol class="next-steps reveal">
{{contact_steps}}
      </ol>
      <div class="intake-frame">
        <iframe id="intakeFrame" src="https://os.takeitaizy.dev/intake?embed=1&amp;theme=light&amp;lang=he&amp;utm_source=takeitaizy.dev&amp;utm_medium=website&amp;utm_content={{form}}" title="טופס פנייה ל-Take It AIzy" data-en-title="Contact form for Take It AIzy" loading="lazy"></iframe>
      </div>
      <p class="contact-alt" data-en-html="Prefer to write to us directly? <a href='{{wa_href_en}}' target='_blank' rel='noopener'>WhatsApp</a> · <a href='mailto:hello@takeitaizy.dev' class='lat'>hello@takeitaizy.dev</a>">מעדיפים לכתוב לנו ישירות? <a href="{{wa_href}}" target="_blank" rel="noopener">וואטסאפ</a> · <a href="mailto:hello@takeitaizy.dev" class="lat">hello@takeitaizy.dev</a></p>
    </div>
  </div>
</section>
